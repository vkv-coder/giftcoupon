<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Coupon | AnyApps.in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F2A3D;
    --navy-light:#173B54;
    --gold:#D4A24C;
    --cream:#FAF8F4;
    --text:#3A4552;
    --muted:#8A95A1;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--cream);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .brand{
    text-align:center;
    margin-bottom:40px;
  }
  .brand .ticket-icon{
    width:56px;height:56px;
    margin:0 auto 16px;
    background:var(--gold);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;
  }
  .brand h1{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size:28px;
    color:var(--navy);
    letter-spacing:-0.5px;
  }
  .brand p{
    color:var(--muted);
    font-size:14px;
    margin-top:6px;
  }
  .cards{
    display:flex;
    flex-direction:column;
    gap:16px;
    width:100%;
    max-width:380px;
  }
  .card{
    background:#fff;
    border:1px solid #EAE4D8;
    border-radius:16px;
    padding:24px;
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:16px;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow:0 1px 3px rgba(15,42,61,0.06);
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(15,42,61,0.10);
  }
  .card .icon{
    width:48px;height:48px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    flex-shrink:0;
  }
  .card.store .icon{background:var(--navy);color:var(--gold);}
  .card.company .icon{background:#FBF1DF;color:var(--gold);}
  .card .label h2{
    font-family:'Poppins',sans-serif;
    font-size:17px;
    color:var(--navy);
    font-weight:700;
  }
  .card .label p{
    font-size:13px;
    color:var(--muted);
    margin-top:2px;
  }
  footer{
    margin-top:48px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
  footer a{color:var(--muted);text-decoration:underline;}
  footer .links{margin-top:6px;}
</style>
</head>
<body>

  <div class="brand">
    <div class="ticket-icon">🎟️</div>
    <h1>Gift Coupon</h1>
    <p>Digital gift coupons, redeemed in-store</p>
  </div>

  <div class="cards">
    <a href="store.html" class="card store">
      <div class="icon">🏬</div>
      <div class="label">
        <h2>Store Login</h2>
        <p>Approve companies & redeem coupons</p>
      </div>
    </a>
    <a href="company.html" class="card company">
      <div class="icon">🏢</div>
      <div class="label">
        <h2>Company Login</h2>
        <p>Generate coupons for your employees</p>
      </div>
    </a>
  </div>

  <footer>
    Powered by AnyApps.in
    <div class="links">
      <a href="mailto:vkvcoder.support@gmail.com">vkvcoder.support@gmail.com</a>
      &nbsp;·&nbsp;
      <a href="privacy-policy.html">Privacy Policy</a>
    </div>
  </footer>

</body>
</html>
