<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Gift Coupon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --navy:#0F2A3D; --navy-light:#173B54; --gold:#D4A24C;
    --cream:#FAF8F4; --text:#3A4552; --muted:#8A95A1;
    --green:#2F8F5B; --red:#C24545;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}
  header{
    background:var(--navy);color:#fff;padding:18px 20px;
    display:flex;align-items:center;justify-content:space-between;
  }
  header h1{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;}
  header a{color:var(--gold);text-decoration:none;font-size:13px;}
  main{max-width:440px;margin:0 auto;padding:24px 16px 60px;}
  .box{background:#fff;border:1px solid #EAE4D8;border-radius:14px;padding:22px;margin-bottom:18px;}
  .box h2{font-family:'Poppins',sans-serif;font-size:16px;color:var(--navy);margin-bottom:14px;}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;margin-top:12px;}
  label:first-of-type{margin-top:0;}
  input{
    width:100%;padding:11px 12px;border:1px solid #DDD5C4;border-radius:9px;
    font-size:14px;font-family:'Inter',sans-serif;background:#fff;
  }
  button{
    margin-top:16px;width:100%;padding:12px;border:none;border-radius:9px;
    background:var(--navy);color:#fff;font-size:14px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  button:hover{background:var(--navy-light);}
  .msg{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:8px;}
  .msg.error{background:#FBEAEA;color:var(--red);}
  .msg.success{background:#E9F5EE;color:var(--green);}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .hidden{display:none;}
</style>
</head>
<body>

<header>
  <h1>🎟️ Gift Coupon</h1>
  <a href="index.html">← Home</a>
</header>

<main>
  <div class="box">
    <h2>Set a New Password</h2>
    <div id="formArea" class="hidden">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="••••••••">
      <button onclick="updatePassword()">Update Password</button>
    </div>
    <div id="statusMsg" class="hint">Verifying reset link…</div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://jqqnnkzozjskziaizajg.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcW5ua3pvempza3ppYWl6YWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5Mjk1ODAsImV4cCI6MjA4ODUwNTU4MH0.sEYeWnm0dvuw8bLSVnQhqmgV8LB-pELjpuVIa3Us1Gg";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function init(){
  const statusEl = document.getElementById('statusMsg');
  try {
    const { data } = await sb.auth.getSession();
    if(data.session){
      statusEl.classList.add('hidden');
      document.getElementById('formArea').classList.remove('hidden');
    } else {
      statusEl.innerHTML = 'This reset link is invalid or expired. Go back and request a new one from the login page.';
    }
  } catch(err) {
    statusEl.innerHTML = 'Something went wrong verifying this link. Please check your connection and try again.';
  }
}

sb.auth.onAuthStateChange((event) => {
  if(event === 'PASSWORD_RECOVERY'){
    document.getElementById('statusMsg').classList.add('hidden');
    document.getElementById('formArea').classList.remove('hidden');
  }
});

async function updatePassword(){
  const newPassword = document.getElementById('newPassword').value;
  const statusEl = document.getElementById('statusMsg');
  statusEl.className = 'hint';

  if(!newPassword || newPassword.length < 6){
    statusEl.innerHTML = '<div class="msg error">Password must be at least 6 characters.</div>';
    statusEl.classList.remove('hidden');
    return;
  }

  const { error } = await sb.auth.updateUser({ password: newPassword });

  document.getElementById('formArea').classList.add('hidden');
  statusEl.classList.remove('hidden');

  if(error){
    statusEl.innerHTML = `<div class="msg error">${error.message}</div>`;
    document.getElementById('formArea').classList.remove('hidden');
    return;
  }

  statusEl.innerHTML = '<div class="msg success">Password updated. You can now log in with your new password.</div>';
}

init();
</script>

</body>
</html>
